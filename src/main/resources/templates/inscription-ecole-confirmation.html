<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduSystem Pro | Etablissement cree</title>
<link rel="stylesheet" href="/css/fonts.css">
<script src="/js/tailwind.js"></script>
<style>
    body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-12">
<div class="w-full max-w-lg bg-white border border-[#e2e8f0] rounded-xl shadow-sm p-8">
<div class="flex flex-col items-center mb-8 text-center">
<span class="material-symbols-outlined text-[#00236f] text-[48px] mb-2" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<h1 class="text-2xl font-bold text-[#00236f]">Etablissement cree avec succes</h1>
<p class="text-sm text-[#505f76] mt-2" th:text="'« ' + ${nomEcole} + ' » est maintenant enregistre dans le systeme.'"></p>
<p class="text-sm text-[#00236f] mt-1" th:if="${nbClassesCreees != null and nbClassesCreees > 0}"
   th:text="${nbClassesCreees} + ' classe(s) ont ete creees automatiquement. Vous pouvez deja inscrire vos eleves.'"></p>
</div>

<div class="space-y-4">
<div class="p-4 rounded-lg bg-[#f2f4f6] border border-[#e2e8f0]">
<p class="text-xs font-semibold text-[#444651] uppercase tracking-wider mb-1">Code d'acces de l'etablissement</p>
<p class="text-lg font-bold text-[#00236f]" th:text="${codeAcces}"></p>
</div>
<div class="p-4 rounded-lg bg-[#f2f4f6] border border-[#e2e8f0]">
<p class="text-xs font-semibold text-[#444651] uppercase tracking-wider mb-1">Identifiant administrateur</p>
<p class="text-base text-[#191c1e]" th:text="${adminEmail}"></p>
</div>
<div class="p-4 rounded-lg bg-[#d0e1fb] border border-[#c5c5d3]">
<p class="text-xs font-semibold text-[#54647a] uppercase tracking-wider mb-1">Mot de passe temporaire</p>
<p class="text-lg font-bold text-[#00236f]" th:text="${motDePasse}"></p>
<p class="text-xs text-[#54647a] mt-2">Notez-le des maintenant : il ne sera plus affiche apres cette page. Pensez a le changer apres la premiere connexion.</p>
</div>
</div>

<button class="mt-8 w-full bg-[#00236f] text-white font-semibold h-12 rounded-lg hover:opacity-90 transition-all" onclick="window.location.href='/login'">Aller a la connexion</button>
</div>
</body>
</html>
