<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PAI &amp; Allergies - Infirmerie</title>
<link rel="stylesheet" href="/css/fonts.css">
<script src="/js/tailwind.js"></script>
<style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
<script id="tailwind-config" th:inline="javascript">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "surface-container-low": "#f2f4f6", "on-primary": "#ffffff", "error": "#ba1a1a", "error-container": "#ffdad6",
            "surface-container-lowest": "#ffffff", "primary": "#00236f", "background": "#f7f9fb",
            "primary-fixed": "#dce1ff", "secondary-container": "#d0e1fb", "tertiary": [[${accentColor}]],
            "outline": "#757682", "surface-variant": "#e0e3e5", "surface-container": "#eceef0",
            "outline-variant": "#c5c5d3", "surface": "#f7f9fb", "secondary": "#505f76",
            "on-background": "#191c1e", "on-surface": "#191c1e", "on-surface-variant": "#444651",
            "success-container": "#c4f7d0", "tertiary-fixed-dim": "#bec6e0"
          },
          borderRadius: { DEFAULT: "0.125rem", lg: "0.25rem", xl: "0.5rem", full: "0.75rem" },
          spacing: { gutter: "24px", xs: "4px", lg: "24px", xl: "32px", sm: "8px", "sidebar-width": "260px", md: "16px", "container-max": "1440px" },
          fontFamily: { "label-md": ["Inter"], "headline-sm": ["Inter"], "body-md": ["Inter"], "label-sm": ["Inter"], "headline-lg": ["Inter"] },
          fontSize: {
            "label-md": ["14px", {lineHeight: "20px", fontWeight: "600"}],
            "headline-sm": ["18px", {lineHeight: "28px", fontWeight: "600"}],
            "headline-lg": ["32px", {lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700"}],
            "body-md": ["14px", {lineHeight: "20px", fontWeight: "400"}],
            "label-sm": ["12px", {lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "500"}]
          }
        }
      }
    }
</script>
</head>
<body class="bg-background font-body-md text-on-background min-h-screen">
<main class="max-w-container-max mx-auto p-lg pb-20 md:pb-lg">
<div class="flex items-center text-outline font-label-sm text-label-sm mb-md">
<a class="hover:underline" th:href="@{/infirmerie}">Infirmerie</a>
<span class="material-symbols-outlined text-[16px] mx-2">chevron_right</span>
<span class="text-primary font-bold">PAI &amp; Allergies</span>
</div>

<div class="mb-lg flex justify-between items-end">
<h2 class="font-headline-lg text-headline-lg text-primary">PAI &amp; Allergies</h2>
<a th:href="@{/infirmerie}" class="flex items-center gap-xs px-lg py-sm rounded-lg border border-outline-variant text-secondary hover:bg-surface-container transition-all font-label-md text-label-md">
<span class="material-symbols-outlined text-[18px]">arrow_back</span> Retour au tableau de bord
</a>
</div>

<div th:if="${successMsg}" class="mb-lg p-md rounded-lg bg-success-container text-on-success-container font-body-md text-body-md" th:text="${successMsg}"></div>
<div th:if="${erreurMsg}" class="mb-lg p-md rounded-lg bg-error-container text-error font-body-md text-body-md" th:text="${erreurMsg}"></div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-lg">

<div class="lg:col-span-1 bg-surface-container-lowest border border-outline-variant rounded-xl p-lg h-fit">
<h3 class="font-headline-sm text-headline-sm mb-md">Ajouter une fiche</h3>
<form class="flex flex-col gap-md" method="post" th:action="@{/infirmerie/pai}">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Élève</label>
<select class="rounded-lg border-outline-variant px-md py-sm font-body-md text-body-md" name="eleveId" required="required">
<option th:each="e : ${eleves}" th:text="${e.nom + ' ' + e.prenom + (e.classe != null ? ' — ' + e.classe.nom : '')}" th:value="${e.id}"></option>
</select>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Type</label>
<select class="rounded-lg border-outline-variant px-md py-sm font-body-md text-body-md" name="type" required="required">
<option value="ALLERGIE">Allergie</option>
<option value="ASTHME">Asthme</option>
<option value="DIABETE">Diabète</option>
<option value="EPILEPSIE">Épilepsie</option>
<option value="AUTRE">Autre</option>
</select>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Libellé</label>
<input class="rounded-lg border-outline-variant px-md py-sm font-body-md text-body-md" name="libelle" placeholder="Ex: Allergie Arachide" required="required" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Protocole / Instructions en cas de crise</label>
<textarea class="rounded-lg border-outline-variant px-md py-sm font-body-md text-body-md" name="protocole" placeholder="Ex: Administrer le stylo adrénaline, contacter les parents..." rows="3"></textarea>
</div>
<button class="bg-primary text-on-primary font-label-md text-label-md px-lg py-sm rounded-lg hover:opacity-90 transition-all flex items-center justify-center gap-xs" type="submit">
<span class="material-symbols-outlined text-[20px]">add</span> Ajouter
</button>
</form>
</div>

<div class="lg:col-span-2 bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden h-fit">
<div class="px-lg py-md border-b border-outline-variant">
<h3 class="font-headline-sm text-headline-sm">Fiches actives</h3>
</div>
<div class="divide-y divide-outline-variant">
<div class="px-lg py-md flex items-center justify-between gap-md" th:each="c : ${conditions}">
<div>
<p class="font-label-md text-label-md" th:text="${c.eleve.prenom + ' ' + c.eleve.nom + (c.eleve.classe != null ? ' — ' + c.eleve.classe.nom : '')}"></p>
<p class="text-body-md text-on-surface-variant" th:text="${c.libelle}"></p>
<p class="text-label-sm text-outline italic" th:if="${c.protocole != null and !c.protocole.isEmpty()}" th:text="${c.protocole}"></p>
</div>
<form method="post" th:action="@{/infirmerie/pai/{id}/desactiver(id=${c.id})}">
<button class="p-2 text-error hover:bg-error-container rounded-full transition-colors" title="Désactiver" type="submit">
<span class="material-symbols-outlined text-[18px]">block</span>
</button>
</form>
</div>
<p th:if="${#lists.isEmpty(conditions)}" class="px-lg py-lg text-center text-outline">Aucune fiche médicale active.</p>
</div>
</div>

</div>
</main>
<div th:replace="~{fragments/mobile-nav-infirmerie :: nav('pai')}"></div>
</body>
</html>
