<!DOCTYPE html>
<html class="light" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nouveau devoir - EduSystem Pro</title>
<link rel="stylesheet" href="/css/fonts.css">
<script src="/js/tailwind.js"></script>
<style>
    body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
</style>
</head>
<body class="bg-background text-on-background">
<header class="bg-white border-b border-gray-200 px-4 md:px-8 py-4 flex items-center gap-3">
<a class="text-gray-500" href="/tableau-enseignant/devoirs"><span class="material-symbols-outlined">arrow_back</span></a>
<h1 class="text-xl font-bold text-blue-900">Nouveau devoir</h1>
</header>

<main class="max-w-2xl mx-auto px-4 md:px-8 py-4 md:py-8">
<div th:if="${erreurAuth}" class="mb-4 p-3 rounded-lg bg-red-100 text-red-800 text-sm" th:text="${erreurAuth}"></div>
<!-- Un enseignant a qui aucune classe n'a encore ete attribuee voyait ce formulaire avec deux
     menus deroulants vides : il pouvait tout remplir, cliquer, et se heurter a un refus sans
     comprendre que le probleme n'etait pas sa saisie. Le formulaire n'est pas affiche tant
     qu'il n'a rien a y choisir, et la marche a suivre est dite. -->
<div class="bg-white border border-gray-200 rounded-xl p-4 md:p-8" th:if="${#lists.isEmpty(classes)}">
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-amber-600">info</span>
<div>
<p class="font-bold text-gray-900">Aucune classe ne vous est encore attribuee.</p>
<p class="text-sm text-gray-600 mt-1">
Un devoir se rattache toujours a une classe et a une matiere. Demandez a
l'administration de vous affecter vos classes et vos matieres : elles apparaitront
ici aussitot.
</p>
<a class="inline-block mt-3 text-sm text-blue-900 hover:underline" href="/tableau-enseignant">Retour a mon tableau</a>
</div>
</div>
</div>

<div class="bg-white border border-gray-200 rounded-xl p-4 md:p-8" th:unless="${#lists.isEmpty(classes)}">
<form class="space-y-4" enctype="multipart/form-data" method="post" th:action="@{/tableau-enseignant/devoirs}">

<div>
<label class="text-xs text-gray-500 block mb-1">Titre du devoir</label>
<input class="w-full p-2 border border-gray-300 rounded-lg" name="titre" required="required" type="text"/>
</div>

<div>
<label class="text-xs text-gray-500 block mb-1">Description / consignes</label>
<textarea class="w-full p-2 border border-gray-300 rounded-lg" name="description" rows="4"></textarea>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<div>
<label class="text-xs text-gray-500 block mb-1">Classe</label>
<select class="w-full p-2 border border-gray-300 rounded-lg" name="classeId" required="required">
<option th:each="c : ${classes}" th:text="${c.nom} + ' (' + ${c.niveau} + ')'" th:value="${c.id}"></option>
</select>
</div>
<div>
<label class="text-xs text-gray-500 block mb-1">Matiere</label>
<select class="w-full p-2 border border-gray-300 rounded-lg" name="matiereId">
<option value="">—</option>
<option th:each="m : ${matieres}" th:text="${m.nom}" th:value="${m.id}"></option>
</select>
</div>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<div>
<label class="text-xs text-gray-500 block mb-1">Date d'echeance</label>
<input class="w-full p-2 border border-gray-300 rounded-lg" name="dateEcheance" required="required" type="date"/>
</div>
<div>
<label class="text-xs text-gray-500 block mb-1">Priorite</label>
<select class="w-full p-2 border border-gray-300 rounded-lg" name="priorite">
<option value="HAUTE">Haute</option>
<option selected="selected" value="MOYENNE">Moyenne</option>
<option value="BASSE">Basse</option>
</select>
</div>
</div>

<div>
<label class="text-xs text-gray-500 block mb-1">Piece jointe (consignes, support...)</label>
<input class="w-full p-2 border border-gray-300 rounded-lg" name="pieceJointe" type="file"/>
</div>

<div class="flex items-center gap-2">
<input id="publierImmediatement" name="publierImmediatement" type="checkbox" value="true"/>
<label class="text-sm text-gray-700" for="publierImmediatement">Publier immediatement (visible par les eleves de la classe)</label>
</div>

<div class="flex justify-end gap-3 pt-4">
<a class="px-5 py-2 border border-gray-300 rounded-lg" href="/tableau-enseignant/devoirs">Annuler</a>
<button class="px-5 py-2 bg-blue-900 text-white rounded-lg font-medium" type="submit">Creer le devoir</button>
</div>
</form>
</div>
</main>
</body>
</html>
