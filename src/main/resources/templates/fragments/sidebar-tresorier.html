<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Navigation des pages Finances/Tresorerie (ADMIN + TRESORIER).
  Usage : <div th:replace="~{fragments/sidebar-tresorier :: admin('financier')}"></div>
  activePage : financier (page unique /finances a onglets : Journal, Scolarite, Depenses, Budget, Rapports).
  Les liens sont definis une seule fois (fragment "liens") et reutilises par
  la sidebar desktop et le panneau de menu mobile, pour eviter que les deux
  divergent.
-->
<div th:fragment="admin(activePage)">
<aside class="hidden md:flex fixed left-0 top-0 h-full w-[260px] bg-tertiary border-r border-outline-variant flex-col z-50">
<div class="p-lg">
<div class="flex items-center gap-sm mb-xl">
<div class="w-10 h-10 bg-primary-fixed rounded flex items-center justify-center">
<span class="material-symbols-outlined text-primary">school</span>
</div>
<div>
<h1 class="font-headline-sm text-headline-sm font-bold text-on-tertiary">EduSystem Pro</h1>
<p class="text-label-sm text-on-tertiary/60" th:text="(${utilisateurConnecte != null and utilisateurConnecte.role == 'TRESORIER'}) ? 'Portail Tresorerie' : ((${utilisateurConnecte != null and utilisateurConnecte.role == 'COMPTABLE'}) ? 'Portail Comptabilite' : 'Portail Admin')">Portail Admin</p>
</div>
</div>
<div th:replace="~{fragments/nav-links-tresorier :: liens(activePage)}"></div>
</div>
<div class="mt-auto p-lg border-t border-outline-variant/20">
<a class="w-full bg-primary text-white py-sm rounded-lg font-label-md flex items-center justify-center gap-base active:scale-95 transition-all mb-lg" th:href="@{/finances/nouvelle-transaction}">
<span class="material-symbols-outlined text-[20px]">add</span>
Nouvelle Transaction
</a>
<div class="space-base">
<a class="flex items-center px-md py-sm rounded text-on-tertiary-container/70 hover:text-on-tertiary transition-all duration-200" th:href="@{/parametres}" th:if="${utilisateurConnecte != null and utilisateurConnecte.role == 'ADMIN'}">
<span class="material-symbols-outlined mr-md">settings</span>
<span class="font-body-md text-body-md">Parametres</span>
</a>
<a class="flex items-center px-md py-sm rounded text-on-tertiary-container/70 hover:text-on-tertiary transition-all duration-200" href="mailto:support@holyflame.com">
<span class="material-symbols-outlined mr-md">help</span>
<span class="font-body-md text-body-md">Support</span>
</a>
</div>
</div>
</aside>

<div class="md:hidden">
<nav class="fixed bottom-0 left-0 w-full flex items-stretch h-14 bg-surface/90 backdrop-blur-md border-t border-outline-variant z-50">
<a class="flex-1 flex flex-col items-center justify-center gap-0.5 text-secondary" th:href="@{/dashboard}">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-label-sm text-label-sm">Tableau</span>
</a>
<button type="button" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-primary font-semibold" onclick="document.getElementById('mobile-more-panel-financier').classList.remove('hidden')">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="font-label-sm text-label-sm">Comptabilite</span>
</button>
</nav>
<div id="mobile-more-panel-financier" class="hidden fixed inset-0 bg-tertiary z-[60] flex flex-col">
<div class="flex items-center justify-between px-lg py-md border-b border-tertiary-container/30 flex-shrink-0">
<h2 class="font-headline-sm text-headline-sm font-bold text-on-tertiary">Menu</h2>
<button type="button" class="text-on-tertiary-container p-xs" onclick="document.getElementById('mobile-more-panel-financier').classList.add('hidden')">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="flex-grow overflow-y-auto px-lg py-md">
<div th:replace="~{fragments/nav-links-tresorier :: liens(activePage)}"></div>
</div>
</div>
</div>
</div>
</body>
</html>
