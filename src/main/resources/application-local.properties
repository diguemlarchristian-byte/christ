# Profil « local » — l'ecole fait tourner le logiciel sur sa propre machine, sans MySQL.
#
# A activer avec : java -jar administration.jar --spring.profiles.active=local
#
# La base est un FICHIER, jamais la memoire. C'est le point sur lequel il ne faut pas se
# tromper : H2 sait fonctionner en memoire, et la plupart des exemples que l'on trouve
# utilisent ce mode-la. Une ecole qui demarrerait ainsi perdrait ses inscriptions, ses
# paiements et ses notes a chaque arret du serveur, sans le moindre avertissement. Le mode
# fichier ecrit dans donnees/ecole.mv.db, un fichier ordinaire que l'on sauvegarde en le
# copiant. Un test du depot echoue si ce reglage repasse un jour en memoire.
spring.datasource.url=jdbc:h2:file:./donnees/ecole;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# AUTO_SERVER=TRUE ci-dessus autorise un second processus a ouvrir la meme base — utile pour
# une sauvegarde a chaud ou un outil d'inspection, sans arreter l'ecole.

# Console H2 : fermee par defaut. Elle donne un acces direct a toutes les donnees ; ne
# l'ouvrir que le temps d'un depannage, et jamais sur une machine joignable de l'exterieur.
spring.h2.console.enabled=false

# Le serveur ecoute sur toutes les interfaces de la machine, pas seulement sur elle-meme :
# c'est ce qui permet aux autres postes de l'ecole de s'y connecter.
server.address=0.0.0.0

# Les fichiers televerses — justificatifs, photos, bulletins archives — vivent a cote de la
# base, dans le meme dossier d'installation. Une sauvegarde du dossier emporte donc tout.
app.upload.dir=./donnees/fichiers
